<!doctype html><html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHYSICS ATLAS | 大學普通物理</title><style>
:root{--bg:#091323;--panel:#101f32;--line:#23364c;--text:#e9eff8;--sub:#9aafc7;--cyan:#79c8ff;--mint:#8ee5c0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.75 system-ui,-apple-system,"Noto Sans TC",sans-serif}button,input{font:inherit}button{cursor:pointer}header{height:67px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 24px;border-bottom:1px solid var(--line);background:#0c192b;position:sticky;top:0;z-index:2}.brand{font-size:21px;font-weight:850;letter-spacing:.5px}.brand span{color:var(--mint)}.topnote{font-size:13px;color:var(--sub)}.layout{display:grid;grid-template-columns:265px minmax(0,1fr);min-height:calc(100vh - 67px)}aside{border-right:1px solid var(--line);padding:22px 14px;background:#0c192a}aside h4{color:var(--sub);font-size:11px;letter-spacing:2px;margin:20px 13px 9px}aside button{display:block;width:100%;border:0;text-align:left;background:transparent;border-radius:10px;padding:11px 13px;color:#c7d8ed;font-size:14px;margin:5px 0}aside button:hover,aside button.active{color:#eaf8ff;background:#193754}aside .chapter-no{font-size:11px;color:var(--mint);font-weight:750;display:block}main{max-width:1160px;width:100%;margin:auto;padding:35px 36px 85px}.eyebrow{color:var(--mint);letter-spacing:2px;font-weight:800;font-size:11px}.hero{padding:46px 40px;border-radius:21px;border:1px solid #315270;background:radial-gradient(circle at 85% 10%,#255d82 0%,transparent 45%),linear-gradient(125deg,#182e46,#101f33);margin-bottom:28px}.hero h1{font-size:clamp(30px,4vw,49px);line-height:1.26;letter-spacing:-1px;margin:13px 0}.hero p{max-width:670px;color:#c9d9ec}.pill{display:inline-block;color:#a9e6cf;background:#163d44;border:1px solid #356b67;border-radius:30px;font-size:12px;padding:4px 11px;margin:3px}.primary{background:var(--mint);color:#062535;border:0;border-radius:10px;padding:12px 18px;font-weight:750}.secondary{border:1px solid #4c7190;color:#d1e7fa;border-radius:10px;background:#1a344e;padding:11px 17px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}h2{font-size:25px;line-height:1.35}h3{font-size:17px;margin-top:0}.muted{color:var(--sub)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.tile,.paper{background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:24px}.tile{cursor:pointer;text-align:left;color:var(--text);transition:transform .2s,border-color .2s}.tile:hover{transform:translateY(-3px);border-color:var(--cyan)}.tile .num{font-size:30px;color:var(--cyan);font-weight:850}.tile .en{font-size:12px;color:var(--sub)}.paper{margin:18px 0}.paper p{color:#d4e0ee;margin:12px 0}.paper .sectiontag{font-size:11px;letter-spacing:2px;color:var(--mint);font-weight:750}.formula{padding:20px;margin:18px 0;border-radius:10px;background:#071523;border-left:4px solid var(--cyan);font-family:Georgia,serif;font-size:clamp(16px,2vw,23px);white-space:normal;overflow-wrap:anywhere}.question{background:#102d35;border-left:3px solid var(--mint);padding:18px;border-radius:9px;font-size:17px}.options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.option{background:#13283d;border:1px solid #3c5670;color:var(--text);border-radius:10px;padding:13px;text-align:left}.option.correct{background:#184339;border-color:#64c99e}.option.wrong{background:#4b2830;border-color:#cf7b83}.feedback{background:#0b2730;padding:15px;border-radius:10px;margin-top:14px}.feedback[hidden]{display:none}.navrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}input[type=range]{width:100%;accent-color:#79c8ff}canvas{width:100%;border:1px solid #294761;border-radius:12px;background:#071421}.stats{color:var(--mint);font-weight:650;margin:15px 0}.labs{display:grid;grid-template-columns:1fr 1fr;gap:15px}.footer{color:#748aa3;font-size:12px;margin-top:40px}a{color:var(--cyan)}@media(max-width:820px){.layout{display:block}header{padding:0 12px}.topnote{display:none}aside{display:flex;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px}aside h4{display:none}aside button{min-width:150px;font-size:12px}main{padding:18px}.hero{padding:28px 22px}.labs{grid-template-columns:1fr}.options{grid-template-columns:1fr}} 
</style></head><body><header><div class="brand">◈ PHYSICS <span>ATLAS</span></div><div class="topnote">中文概念 × English Practice　·　University Physics</div></header><div class="layout"><aside id="menu"></aside><main id="app"></main></div><script>
const lessons=[{"ch":"01","name":"測量與科學方法","topic":"測量、不確定度與有效位數","subtitle":"Measurement & Uncertainty","body":["任何測量都受到儀器解析度、環境與操作方式的限制。因此測量結果應包含數值、單位與不確定度。例如 8.8 ± 0.1 cm 代表合理估計的長度範圍。","有效位數用來反映測量精確程度，而不是數字寫得愈多愈好。乘除法通常依參與計算資料中最少的有效位數決定答案位數。"],"eq":"相對不確定度 = Δx / |x| × 100%","derive":"若 L = 8.8 ± 0.1 cm，則百分不確定度 = 0.1 / 8.8 × 100% ≈ 1.14%。這描述不確定度相對於測量值的比例。","q":"A rectangle measures 11.3 cm by 6.8 cm. Calculate its area and report the result with the correct number of significant figures.","opts":["76.84 cm²","77 cm²","76.8 cm²","7.7 cm²"],"correct":1,"why":"11.3 × 6.8 = 76.84 cm²；其中 6.8 只有兩位有效數字，最終表示為 77 cm²。"},{"ch":"02","name":"一維運動學","topic":"瞬時速度與微分","subtitle":"Instantaneous Velocity","body":["位移是末位置與初位置之差，路程則是實際經過的總距離。平均速度是某段時間內的位移除以時間，而瞬時速度描述某一瞬間的位置變化率。","在位置—時間圖上，平均速度對應兩點連線（割線）的斜率；當時間間隔趨近零，割線趨近切線，得到瞬時速度。"],"eq":"v(t) = lim(Δt→0) [x(t+Δt)−x(t)] / Δt = dx/dt","derive":"若 x(t)=3t²+2t（SI），則 v(t)=d(3t²+2t)/dt=6t+2。因此 t=2 s 時 v=14 m/s。若再微分一次，a(t)=dv/dt=6 m/s²。","q":"The position of a particle is x(t)=3t²+2t (SI units). What is its instantaneous velocity at t=2.0 s?","opts":["6 m/s","10 m/s","14 m/s","18 m/s"],"correct":2,"why":"先微分求 v(t)=6t+2，然後代入 t=2，得到 14 m/s。"},{"ch":"04","name":"牛頓運動定律","topic":"力、動量與牛頓第二定律","subtitle":"Newton's Second Law","body":["受力分析應先選定研究物體，單獨畫出所有作用在它身上的外力。物體即使正在運動，合力也可能是零；合力決定的是加速度，而不是速度本身。","牛頓第二定律可從動量變化率描述。對質量固定的物體，動量 p=mv，於是合外力等於質量乘加速度。在非慣性參考系使用時，須另外考慮慣性力。"],"eq":"ΣF⃗ = dp⃗/dt；若 m 固定，ΣF⃗ = m a⃗","derive":"固定質量 m 時，dp⃗/dt = d(mv⃗)/dt = m(dv⃗/dt)=ma⃗。若外力隨時間改變 F(t)，先以 a(t)=F(t)/m 求加速度，再積分得到速度變化。","q":"A 2.0-kg block is acted on by a constant net force of 10 N. What is its acceleration?","opts":["0.2 m/s²","5.0 m/s²","12 m/s²","20 m/s²"],"correct":1,"why":"由 ΣF=ma，a=10/2=5.0 m/s²，方向與合力相同。"},{"ch":"05","name":"摩擦與圓周運動","topic":"靜摩擦、向心加速度","subtitle":"Friction & Circular Motion","body":["靜摩擦不一定等於 μsN，而是隨相對滑動趨勢調整，最大值才是 μsN。動摩擦在簡化模型中可寫為 fk≈μkN。","等速圓周運動雖然速率不變，速度向量的方向仍持續改變，因此具有指向圓心的加速度。向心力指的是徑向合力，不是額外多出來的一種力。"],"eq":"|fs| ≤ μs N；ac = v²/r；ΣFr = mv²/r","derive":"考慮速度大小 v 固定、方向轉過很小角 Δθ，速度差大小約 Δv ≈ vΔθ。由 Δθ/Δt=v/r，取極限得到 a=v²/r，方向向圓心。","q":"A 2.0-kg object moves in a circle of radius 4.0 m at 6.0 m/s. Find the required centripetal force.","opts":["3 N","9 N","18 N","72 N"],"correct":2,"why":"F=mv²/r=2×36/4=18 N。這是徑向合力大小。"},{"ch":"06","name":"萬有引力","topic":"萬有引力與衛星軌道","subtitle":"Universal Gravitation","body":["任何兩個具有質量的物體都彼此吸引。對兩質點而言，引力大小與質量乘積成正比，與中心距離平方成反比；引力方向沿兩者連線。","衛星做圓周運動時，地球引力提供向心力。軌道上的失重通常指自由落體狀態，不表示沒有地球重力。"],"eq":"F = Gm₁m₂/r²；v_orbit = √(GM/r)","derive":"令萬有引力 GMm/r² 等於圓周運動所需的 mv²/r；消去衛星質量 m，可得 v²=GM/r，故 v=√(GM/r)。","q":"If the distance between two point masses is doubled, how does their gravitational attraction change?","opts":["Doubles","Halves","Becomes one-fourth","Becomes four times larger"],"correct":2,"why":"反平方關係 F∝1/r²，因此距離變兩倍，引力變為原本的 1/4。"}];
let current=-1;const $=id=>document.getElementById(id);
function menu(){ $('menu').innerHTML='<h4>LEARNING PATH</h4><button class="'+(current===-1?'active':'')+'" onclick="home()">⌂　首頁 / Overview</button>'+lessons.map((x,i)=>'<button class="'+(current===i?'active':'')+'" onclick="openLesson('+i+')"><span class="chapter-no">CHAPTER '+x.ch+'</span>'+x.name+'</button>').join('')+'<h4>INTERACTIVE</h4><button class="'+(current===9?'active':'')+'" onclick="lab()">⚗　物理互動實驗室</button>';}
function home(){current=-1;menu();const done=JSON.parse(localStorage.getItem('atlas-done')||'[]');$('app').innerHTML='<section class="hero"><div class="eyebrow">INTERACTIVE UNIVERSITY PHYSICS TEXTBOOK</div><h1>學物理，不只背公式。<br>從觀念到推導，真正理解。</h1><p>依照你提供的 Giancoli Chapter 1、2、4、5、6 編排首批教材。用繁體中文講清楚觀念、公式與微積分推導，並透過英文練習題檢查理解。</p><div><span class="pill">繁體中文詳解</span><span class="pill">English Questions</span><span class="pill">互動物理圖解</span></div><div class="actions"><button class="primary" onclick="openLesson(0)">開始學習 →</button><button class="secondary" onclick="lab()">進入實驗室 ↗</button></div></section><h2>課程章節 <span class="muted" style="font-size:14px;font-weight:400">/ '+done.length+' 個已完成</span></h2><div class="grid">'+lessons.map((x,i)=>'<button class="tile" onclick="openLesson('+i+')"><div class="num">'+x.ch+'</div><h3>'+x.name+'</h3><div class="en">'+x.subtitle+'</div><p class="muted">'+x.topic+'</p><span style="color:var(--mint);font-size:13px">'+(done.includes(i)?'✓ 已讀':'開始閱讀 →')+'</span></button>').join('')+'</div><p class="footer">本版是可操作的課程網站雛形：首批五章各有一節完整示範教學、原創英文測驗與模擬；不是 Giancoli 全書逐字翻譯或完整講義重製。</p>';window.scrollTo(0,0)}
function openLesson(i){current=i;menu();const x=lessons[i];$('app').innerHTML='<div class="eyebrow">CHAPTER '+x.ch+' · '+x.subtitle.toUpperCase()+'</div><h1 style="font-size:36px;margin:8px 0">'+x.topic+'</h1><p class="muted">'+x.name+'</p><section class="paper"><div class="sectiontag">01 / 核心觀念 · CONCEPT</div><h2>先理解物理意義</h2>'+x.body.map(t=>'<p>'+t+'</p>').join('')+'</section><section class="paper"><div class="sectiontag">02 / 數學關係 · EQUATION</div><h2>公式與適用條件</h2><div class="formula">'+x.eq+'</div><p>套用公式前必須確認假設、方向與單位。公式不是孤立的記憶題，而是描述特定條件下的物理關係。</p></section><section class="paper"><div class="sectiontag">03 / 推導 · DERIVATION</div><h2>從基本定義推導</h2><p>'+x.derive+'</p></section><section class="paper"><div class="sectiontag">04 / PRACTICE IN ENGLISH</div><h2>英文觀念與計算練習</h2><div class="question">'+x.q+'</div><div class="options">'+x.opts.map((s,k)=>'<button class="option" onclick="answer('+i+','+k+',this)">'+String.fromCharCode(65+k)+'. '+s+'</button>').join('')+'</div><div id="feedback" class="feedback" hidden></div></section><div class="navrow"><button class="secondary" onclick="home()">← 返回目錄</button><button class="secondary" onclick="lab()">物理實驗室 ↗</button>'+(i<lessons.length-1?'<button class="primary" onclick="openLesson('+(i+1)+')">下一章 →</button>':'')+'</div>';window.scrollTo(0,0)}
function answer(i,k,b){const x=lessons[i],buttons=document.querySelectorAll('.option');buttons.forEach((q,j)=>{q.disabled=true;if(j===x.correct)q.classList.add('correct');if(j===k&&j!==x.correct)q.classList.add('wrong')});$('feedback').hidden=false;$('feedback').innerHTML='<b>'+(k===x.correct?'✓ Correct！':'再確認一下解題觀念')+'</b><p>'+x.why+'</p>';if(k===x.correct){const a=JSON.parse(localStorage.getItem('atlas-done')||'[]');if(!a.includes(i)){a.push(i);localStorage.setItem('atlas-done',JSON.stringify(a))}}}
function lab(){current=9;menu();$('app').innerHTML='<div class="eyebrow">INTERACTIVE PHYSICS LAB</div><h1>互動物理實驗室</h1><p class="muted">調整參數，看運動軌跡與物理量怎麼改變。以下均為理想化模型。</p><div class="paper"><h2>拋體運動 · Projectile Motion</h2><div class="labs"><label>初速度 <b id="vval">20</b> m/s<input type="range" min="5" max="40" value="20" id="v" oninput="draw()"></label><label>發射角度 <b id="aval">45</b>°<input type="range" min="5" max="85" value="45" id="angle" oninput="draw()"></label></div><canvas id="chart" width="850" height="330"></canvas><div id="stats" class="stats"></div><p class="muted">忽略空氣阻力，且假設起點與落點同高。x(t)=v₀cosθt；y(t)=v₀sinθt−½gt²；R=v₀²sin(2θ)/g。</p></div><div class="paper"><h2>圓周運動 · Circular Motion</h2><div class="labs"><label>質量 <b id="mval">2</b> kg<input type="range" id="m" min="1" max="10" value="2" oninput="draw()"></label><label>速率 <b id="sval">6</b> m/s<input type="range" id="s" min="1" max="15" value="6" oninput="draw()"></label><label>半徑 <b id="rval">4</b> m<input type="range" id="r" min="1" max="12" value="4" oninput="draw()"></label></div><canvas id="circle" width="850" height="250"></canvas><div id="circleStats" class="stats"></div><p class="muted">速度沿切線，向心加速度指向圓心。向心力 F=mv²/r 指的是徑向合力。</p></div>';draw();window.scrollTo(0,0)}
function line(ctx,x,y,X,Y,col,w=2){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(X,Y);ctx.lineWidth=w;ctx.strokeStyle=col;ctx.stroke()}
function draw(){if(!$('chart'))return;const v=+$('v').value,a=+$('angle').value*Math.PI/180,g=9.8,T=2*v*Math.sin(a)/g,R=v*v*Math.sin(2*a)/g,H=v*v*Math.sin(a)**2/(2*g);$('vval').textContent=v;$('aval').textContent=$('angle').value;$('stats').textContent='射程 '+R.toFixed(1)+' m　｜　飛行時間 '+T.toFixed(2)+' s　｜　最高點 '+H.toFixed(1)+' m';let c=$('chart'),p=c.getContext('2d');p.clearRect(0,0,850,330);line(p,45,290,820,290,'#60819e');line(p,45,20,45,290,'#60819e');p.beginPath();for(let j=0;j<=100;j++){let t=T*j/100,x=45+740*(v*Math.cos(a)*t/R),y=290-240*(v*Math.sin(a)*t-.5*g*t*t)/Math.max(H,1);j?p.lineTo(x,y):p.moveTo(x,y)}p.strokeStyle='#8ee5c0';p.lineWidth=4;p.stroke();p.fillStyle='#9baec2';p.fillText('x',815,310);p.fillText('y',26,22);let m=+$('m').value,s=+$('s').value,r=+$('r').value;$('mval').textContent=m;$('sval').textContent=s;$('rval').textContent=r;$('circleStats').textContent='向心加速度 '+(s*s/r).toFixed(2)+' m/s²　｜　徑向合力 '+(m*s*s/r).toFixed(2)+' N';c=$('circle');p=c.getContext('2d');p.clearRect(0,0,850,250);p.beginPath();p.strokeStyle='#537c9a';p.lineWidth=3;p.arc(400,122,85,0,7);p.stroke();p.beginPath();p.fillStyle='#8ee5c0';p.arc(485,122,9,0,7);p.fill();line(p,485,122,405,122,'#ffb77c',5);line(p,405,122,420,113,'#ffb77c',3);line(p,405,122,420,131,'#ffb77c',3);line(p,485,122,485,40,'#8ee5c0',5);p.fillStyle='#eff';p.fillText('切向速度 v',500,43);p.fillText('向心加速度 a',285,102)}
home();
</script></body></html>
