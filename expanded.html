const chapters=[{"id":"vectors","no":"03","title":"向量與座標系","en":"Vectors","tag":"數學基礎","concept":["純量只有大小，向量同時具有大小和方向。位移、速度、加速度與力都是向量，不能直接把各方向的數值相加。","直角座標中的向量可拆為 x、y 分量。分量是帶符號的純量，正負號來自座標軸方向，不代表物理量本身是「負的大小」。","相同向量在不同座標系下會有不同分量，但其幾何大小不會因為旋轉座標軸而改變。"],"formula":"\\vec A=A_x\\hat{\\mathbf i}+A_y\\hat{\\mathbf j},\\qquad |\\vec A|=\\sqrt{A_x^2+A_y^2}","steps":[["選定水平向右、鉛直向上的座標。","A_x=A\\cos\\theta,\\qquad A_y=A\\sin\\theta"],["利用畢氏定理求向量的大小。","A^2=A_x^2+A_y^2"],["方向由分量與象限共同決定，不能只靠反正切的正值判斷。","\\theta=\\operatorname{atan2}(A_y,A_x)"]],"example":"A displacement has components 6.0 m east and 8.0 m north. Determine its magnitude and direction.","answer":["大小：√(6²+8²)=10.0 m。","方向：tan⁻¹(8/6)=53.1°，位於東方逆時針 53.1°（北偏東的另一種描述）。"],"q":"Which quantity is a vector?","options":["Temperature","Distance","Displacement","Energy"],"correct":2,"explain":"位移有方向與大小；溫度、路程與能量是純量。","graphic":"vector"},{"id":"motion","no":"04","title":"二維運動與拋體","en":"Motion in Two Dimensions","tag":"運動學","concept":["在固定直角座標中，二維運動可以視為 x 與 y 兩個互相獨立的運動方程，但它們共享同一個時間參數 t。","忽略空氣阻力、近地表 g 為常數時，拋體的水平加速度為零，鉛直加速度為 −g。軌跡是拋物線；速度方向卻隨時間變化。","最大射程在起點與落點同高、初速固定且無阻力時發生於 45°。若有空氣阻力或高度不同，不能套用這個結論。"],"formula":"\\begin{aligned}x(t)&=v_0\\cos\\theta\\,t\\\\y(t)&=y_0+v_0\\sin\\theta\\,t-\\frac12gt^2\\end{aligned}","steps":[["把初速沿水平、鉛直分解。","v_{0x}=v_0\\cos\\theta,\\qquad v_{0y}=v_0\\sin\\theta"],["分別將加速度積分成速度，再積分成位置。","v_x=v_0\\cos\\theta,\\quad v_y=v_0\\sin\\theta-gt"],["起點與落點同高時令 y(T)=y(0)，求飛行時間與射程。","T=\\frac{2v_0\\sin\\theta}{g},\\qquad R=\\frac{v_0^2\\sin 2\\theta}{g}"]],"example":"A ball is launched at 20.0 m/s at 30.0° above the horizontal. Neglect air resistance. Find its flight time and range.","answer":["鉛直初速 v₀y=20 sin30°=10.0 m/s；飛行時間 T=2v₀y/g=20/9.8=2.04 s。","水平初速 v₀x=20 cos30°≈17.32 m/s；射程 R=v₀xT≈35.3 m。"],"q":"At the highest point of a projectile's trajectory (no air resistance), which statement is correct?","options":["Both velocity components vanish","Vertical velocity is zero, acceleration is downward","Acceleration is zero","Horizontal velocity reverses direction"],"correct":1,"explain":"最高點只有鉛直速度瞬間為零；加速度仍然向下，水平速度維持不變。","graphic":"projectile"},{"id":"forces","no":"05","title":"牛頓定律與受力圖","en":"Laws of Motion","tag":"動力學","concept":["牛頓第二定律連結合外力和加速度。合外力並不等於「所有力大小直接相加」，必須先處理向量方向，再做分量加總。","自由體圖只畫作用在所選物體上的外力。牛頓第三定律的兩個力作用在不同物體，絕不能拿來互相抵消同一張受力圖。","在斜面問題中，把座標軸旋轉成平行與垂直斜面，能讓支持力與重力分量更容易辨認。"],"formula":"\\sum\\vec F=\\frac{d\\vec p}{dt}=m\\vec a\\quad(m=\\mathrm{constant})","steps":[["先選物體及座標軸，依序列出真正存在的外力。","\\sum F_x=ma_x,\\qquad\\sum F_y=ma_y"],["無摩擦斜面，沿斜面向下取正方向。","\\sum F_\\parallel=mg\\sin\\theta=ma"],["若垂直斜面方向無加速度，求支持力。","N-mg\\cos\\theta=0\\;\\Rightarrow\\;N=mg\\cos\\theta"]],"example":"A 3.00-kg block slides down a frictionless incline of 30.0°. Find its acceleration and normal force.","answer":["沿斜面加速度 a=g sin30°=4.90 m/s²，方向沿斜面向下。","支持力 N=mg cos30°≈25.5 N；支持力垂直於斜面，不與重力完全抵銷。"],"q":"A book rests on a table. Which pair is a Newton's third-law pair?","options":["Gravity on the book and table's normal force on the book","Book pushes table and table pushes book","Book's mass and weight","Normal force and friction on the book"],"correct":1,"explain":"作用力、反作用力必須作用在不同物體；書壓桌與桌推書是力對。","graphic":"forces"},{"id":"energy","no":"07","title":"功、動能與能量守恆","en":"Work and Energy","tag":"能量","concept":["功是力沿位移方向累積的效應。即使有力，若位移與力垂直，該力所作的功也為零。","動能定理指出合外力的總功等於物體動能的變化。能量守恆則需要仔細界定系統：摩擦可使機械能轉為內能，但總能量並沒有消失。","位能差有物理意義，位能的零點可以依題目方便選擇。對保守力，作功與起終點有關而與路徑無關。"],"formula":"W=\\int_{\\mathbf r_i}^{\\mathbf r_f}\\vec F\\cdot d\\vec r,\\qquad W_{\\mathrm{net}}=\\Delta K","steps":[["從牛頓第二定律與位移微分開始。","dW=\\vec F\\cdot d\\vec r=m\\frac{d\\vec v}{dt}\\cdot\\vec v\\,dt"],["利用微分恆等式積分。","W_{\\mathrm{net}}=\\int m\\vec v\\cdot d\\vec v=\\frac12mv_f^2-\\frac12mv_i^2"],["對只有保守力作功的封閉機械系統。","K_i+U_i=K_f+U_f"]],"example":"A 2.0-kg cart speeds up from 3.0 m/s to 7.0 m/s. How much net work is done on it?","answer":["動能變化 ΔK=½m(vf²−vi²)。","代入 ½(2.0)(49−9)=40 J，故合外力做功為 +40 J。"],"q":"A force is perpendicular to a particle's displacement. The work done by this force is:","options":["Positive","Negative","Zero","Always equal to kinetic energy"],"correct":2,"explain":"功是內積 F·dr，夾角 90° 時 cos90°=0。","graphic":"energy"},{"id":"momentum","no":"09","title":"動量、衝量與碰撞","en":"Momentum and Collisions","tag":"守恆定律","concept":["線動量是質量與速度的乘積，具有方向。衝量則是力在時間上的積分，代表動量的變化。","若系統所受外部總衝量可忽略，總動量守恆。兩物體碰撞時各自動量可能大幅改變，但整個系統的總動量仍然相同。","動量守恆不代表動能一定守恆。彈性碰撞的動能也守恆；完全非彈性碰撞中物體黏在一起，動能通常減少。"],"formula":"\\vec J=\\int_{t_i}^{t_f}\\vec F_{\\mathrm{net}}\\,dt=\\Delta\\vec p","steps":[["牛頓第二定律的動量形式。","\\vec F_{\\mathrm{net}}=\\frac{d\\vec p}{dt}"],["對時間積分得衝量—動量定理。","\\int_{t_i}^{t_f}\\vec F_{\\mathrm{net}}\\,dt=\\vec p_f-\\vec p_i"],["若外部衝量近似零，總動量維持常數。","\\sum_i m_i\\vec v_{i,\\mathrm{before}}=\\sum_i m_i\\vec v_{i,\\mathrm{after}}"]],"example":"A 1.0-kg cart moving at 4.0 m/s collides and sticks to a stationary 3.0-kg cart. Find their final speed.","answer":["碰撞前總動量 p=1×4+3×0=4 kg·m/s。","碰後合體質量 4 kg，速度 v=4/4=1.0 m/s，方向與第一台車原運動方向相同。"],"q":"In a perfectly inelastic collision of an isolated system, which quantity must be conserved?","options":["Kinetic energy","Total linear momentum","Speed of each object","Mechanical energy"],"correct":1,"explain":"系統外力衝量為零時總動量守恆；完全非彈性碰撞一般不守恆動能。","graphic":"momentum"},{"id":"rotation","no":"10","title":"轉動運動與轉動慣量","en":"Rotation of Rigid Bodies","tag":"剛體力學","concept":["剛體繞固定軸轉動時，每個質點的角位移、角速度相同，但離轉軸越遠的點線速度越大。","轉動慣量衡量質量如何分布於轉軸周圍，不只看總質量。相同總質量但分布不同，所需角加速度可以不同。","力矩是使物體產生角加速度的轉動效應。力與力臂垂直時力矩最大；力的作用線通過轉軸時，對該軸力矩為零。"],"formula":"I=\\sum_i m_ir_i^2,\\qquad \\tau_{\\mathrm{net}}=I\\alpha","steps":[["每個微小質量的切向加速度與角加速度有關。","a_t=r\\alpha"],["在固定轉軸上，切向力矩大小為 rFt。","\\tau_i=r_iF_{t,i}=m_ir_i^2\\alpha"],["所有質點相加，得到剛體轉動方程。","\\sum_i\\tau_i=\\left(\\sum_i m_ir_i^2\\right)\\alpha=I\\alpha"]],"example":"A wheel has moment of inertia 2.0 kg·m² and experiences a net torque of 6.0 N·m. Find its angular acceleration.","answer":["固定轉軸下 Στ=Iα。","α=6/2=3.0 rad/s²，正方向由力矩方向決定。"],"q":"Moving the same mass farther from a fixed rotation axis generally:","options":["Decreases moment of inertia","Increases moment of inertia","Leaves moment of inertia unchanged","Makes angular momentum zero"],"correct":1,"explain":"轉動慣量中的每個質點貢獻為 mr²，因此半徑加大會提高 I。","graphic":"rotation"},{"id":"oscillations","no":"15","title":"簡諧振動與週期","en":"Oscillatory Motion","tag":"振動與波","concept":["若回復力與位移成正比且方向相反，運動方程可以化成簡諧振動微分方程。理想彈簧振子的位置隨時間呈正弦或餘弦變化。","對沒有阻尼的線性彈簧，週期取決於質量與彈簧常數，不受振幅影響；這個結果不能直接推廣到所有振動系統。","在平衡位置速度最大、加速度為零；在兩端轉折點速度為零，但加速度大小最大。速度為零不代表沒有受力。"],"formula":"\\frac{d^2x}{dt^2}+\\frac{k}{m}x=0,\\qquad \\omega=\\sqrt{\\frac{k}{m}}","steps":[["由虎克定律與牛頓第二定律列式。","m\\ddot x=-kx"],["令 ω²=k/m，代入試探解 x=Acos(ωt+φ)。","\\ddot x=-\\omega^2 A\\cos(\\omega t+\\phi)"],["整理得角頻率及週期。","\\omega=\\sqrt{\\frac{k}{m}},\\qquad T=\\frac{2\\pi}{\\omega}=2\\pi\\sqrt{\\frac{m}{k}}"]],"example":"A mass of 0.50 kg is connected to a spring of constant 200 N/m. Determine its oscillation period.","answer":["ω=√(200/0.50)=20 rad/s。","T=2π/20≈0.314 s，這是理想無阻尼彈簧的週期。"],"q":"For an ideal mass–spring oscillator, doubling the mass changes the period by a factor of:","options":["2","√2","1/2","1"],"correct":1,"explain":"T=2π√(m/k)，質量變兩倍，週期乘上 √2。","graphic":"oscillations"},{"id":"electricity","no":"23","title":"電場與電勢的起點","en":"Electric Fields","tag":"電磁學","concept":["電荷之間有電力作用。電場是每單位正測試電荷所受的力，描述空間中每一位置的電力作用，而不需要真的放入測試電荷。","電場是向量，點電荷的電場方向沿著電荷與觀察點的連線。正電荷的電場向外，負電荷的電場向內。多個電荷產生的總電場可向量疊加。","電勢是每單位電荷的電勢能，屬於純量。電場與電勢的梯度有關，但這是後續章節的進階連結。"],"formula":"\\vec E=\\frac{\\vec F}{q_0},\\qquad |\\vec E|=\\frac{k_e|q|}{r^2}","steps":[["庫侖定律給出兩個點電荷間的電力大小。","F=k_e\\frac{|qq_0|}{r^2}"],["用定義除以測試電荷的電量，得到場強大小。","E=\\frac{F}{|q_0|}=\\frac{k_e|q|}{r^2}"],["多個來源電荷產生的場依向量相加。","\\vec E_{\\mathrm{total}}=\\sum_i\\vec E_i"]],"example":"A point charge of +2.0 μC produces an electric field at a distance of 0.30 m. Find the magnitude using ke=8.99×10⁹ N·m²/C².","answer":["將 2.0 μC 換成 2.0×10⁻⁶ C。","E=(8.99×10⁹)(2.0×10⁻⁶)/(0.30)²≈2.0×10⁵ N/C，方向遠離正電荷。"],"q":"What is the direction of the electric field produced by an isolated positive point charge?","options":["Toward the charge","Away from the charge","Tangential to circles around it","Always upward"],"correct":1,"explain":"電場方向定義為正測試電荷受力方向，因此正源電荷的電場向外。","graphic":"electricity"}],arts=["<svg viewBox=\"0 0 700 260\" role=\"img\" aria-label=\"本節原創物理示意圖\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M90 220V35M90 220H605\" stroke=\"#8babbc\" stroke-width=\"2\"/><path d=\"M90 220L460 75\" stroke=\"#8ce5c1\" stroke-width=\"5\"/><path d=\"M440 75L460 75L450 96\" fill=\"none\" stroke=\"#8ce5c1\" stroke-width=\"5\"/><path d=\"M460 75V220H90\" stroke=\"#79c9ff\" stroke-width=\"2\" stroke-dasharray=\"7 6\"/><text x=\"260\" y=\"231\" fill=\"#79c9ff\">Aₓ</text><text x=\"472\" y=\"145\" fill=\"#79c9ff\">Aᵧ</text><text x=\"294\" y=\"125\" fill=\"#8ce5c1\">A⃗</text></svg>","<svg viewBox=\"0 0 700 260\" role=\"img\" aria-label=\"本節原創物理示意圖\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M80 220H620M80 220V30\" stroke=\"#8babbc\" stroke-width=\"2\"/><path d=\"M80 220Q300 -50 550 220\" stroke=\"#8ce5c1\" stroke-width=\"4\" fill=\"none\"/><circle cx=\"310\" cy=\"83\" r=\"9\" fill=\"#ffbc8d\"/><path d=\"M310 83L395 83M310 83L310 148\" stroke=\"#79c9ff\" stroke-width=\"3\"/><text x=\"400\" y=\"82\" fill=\"#79c9ff\">vₓ</text><text x=\"314\" y=\"156\" fill=\"#ffbc8d\">g</text></svg>","<svg viewBox=\"0 0 700 260\" role=\"img\" aria-label=\"本節原創物理示意圖\" xmlns=\"http://www.w3.org/2000/svg\"><path d=\"M90 221L570 221L570 65Z\" fill=\"#244059\" stroke=\"#7591ad\" stroke-width=\"3\"/><rect x=\"333\" y=\"128\" width=\"76\" height=\"48\" rx=\"5\" fill=\"#367a9c\" transform=\"rotate(-18 370 154)\"/><path d=\"M365 145V215\" stroke=\"#ffbc8d\" stroke-width=\"4\"/><path d=\"M365 145L393 66\" stroke=\"#79c9ff\" stroke-width=\"4\"/><text x=\"376\" y=\"220\" fill=\"#ffbc8d\">mg</text><text x=\"403\" y=\"80\" fill=\"#79c9ff\">N</text></svg>","<svg viewBox=\"0 0 700 260\" role=\"img\" aria-label=\"本節原創物理示意圖\" xmlns=\"http://www.w3.org/2000/svg\"><path
